<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GrimACE Lite 实时展示</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel2: #172033;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --green: #22c55e;
      --yellow: #f59e0b;
      --red: #ef4444;
      --blue: #60a5fa;
      --border: rgba(255,255,255,0.10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top left, #1e293b 0, var(--bg) 45%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 22px 28px 8px;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 0.02em;
    }
    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(420px, 1.45fr) minmax(330px, 0.75fr);
      gap: 18px;
      padding: 18px 28px 28px;
      min-height: calc(100vh - 80px);
    }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.22);
      overflow: hidden;
    }
    .video-card {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.16);
    }
    button, input[type="number"], input[type="file"]::file-selector-button {
      border: 1px solid var(--border);
      background: #1f2937;
      color: var(--text);
      border-radius: 12px;
      padding: 9px 12px;
      font-weight: 650;
      cursor: pointer;
    }
    button:hover, input[type="file"]::file-selector-button:hover {
      background: #273244;
    }
    button.primary {
      background: #16a34a;
      border-color: rgba(255,255,255,0.18);
    }
    button.primary:hover { background: #15803d; }
    button.danger {
      background: #991b1b;
    }
    input[type="number"] {
      width: 95px;
      cursor: text;
    }
    input[type="file"] {
      color: var(--muted);
      max-width: 280px;
    }
    label {
      color: var(--muted);
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .video-wrap {
      position: relative;
      background: #020617;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 420px;
    }
    video {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 190px);
      object-fit: contain;
      background: #020617;
    }
    .badge {
      position: absolute;
      left: 14px;
      top: 14px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,0.62);
      color: #d1d5db;
      font-size: 13px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .right {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .status-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .mini {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      min-height: 74px;
    }
    .mini-title {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .mini-value {
      font-size: 20px;
      font-weight: 800;
    }
    .quality-panel {
      background: linear-gradient(135deg, rgba(34,197,94,0.18), rgba(96,165,250,0.12));
      border: 1px solid rgba(34,197,94,0.25);
      border-radius: 20px;
      padding: 18px;
    }
    .quality-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }
    .quality-title {
      color: var(--muted);
      font-size: 14px;
    }
    .quality-value {
      font-size: 46px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.04em;
    }
    .quality-sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .bar {
      margin-top: 14px;
      width: 100%;
      height: 11px;
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--green), var(--yellow));
      border-radius: 999px;
      transition: width 120ms linear;
    }
    .organs {
      display: grid;
      gap: 10px;
    }
    .organ {
      display: grid;
      grid-template-columns: 88px 1fr 56px;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      background: rgba(255,255,255,0.045);
      border: 1px solid var(--border);
      border-radius: 16px;
    }
    .organ-name {
      font-weight: 750;
      text-transform: capitalize;
    }
    .organ-value {
      font-size: 24px;
      font-weight: 900;
      text-align: right;
    }
    .organ .bar {
      margin: 0;
      height: 9px;
    }
    .foot {
      margin-top: auto;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      padding: 12px 2px 2px;
    }
    .ok { color: var(--green); }
    .warn { color: var(--yellow); }
    .bad { color: var(--red); }
    canvas { display: none; }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .status-row { grid-template-columns: 1fr; }
      video { max-height: 56vh; }
    }
  </style>
</head>

<body>
  <header>
    <h1>GrimACE Lite 实时展示</h1>
    <div class="subtitle">左侧播放视频，右侧实时显示 quality 和五个部位评分。后端忙时自动跳过当前帧，不堆积延迟。</div>
  </header>

  <main class="layout">
    <section class="card video-card">
      <div class="toolbar">
        <input id="fileInput" type="file" accept="video/*" />
        <button id="playBtn" class="primary">播放</button>
        <button id="pauseBtn">暂停</button>
        <button id="startBtn" class="primary">开始推理</button>
        <button id="stopBtn" class="danger">停止推理</button>
        <label>间隔(ms)
          <input id="intervalInput" type="number" value="250" min="50" step="50" />
        </label>
      </div>

      <div class="video-wrap">
        <video id="video" controls playsinline muted></video>
        <div id="videoBadge" class="badge">请选择视频或使用服务器预设视频</div>
      </div>
    </section>

    <aside class="card right">
      <div class="status-row">
        <div class="mini">
          <div class="mini-title">状态</div>
          <div id="statusValue" class="mini-value warn">Idle</div>
        </div>
        <div class="mini">
          <div class="mini-title">延迟</div>
          <div id="latencyValue" class="mini-value">-- ms</div>
        </div>
        <div class="mini">
          <div class="mini-title">跳过帧</div>
          <div id="skipValue" class="mini-value">0</div>
        </div>
      </div>

      <section class="quality-panel">
        <div class="quality-head">
          <div>
            <div class="quality-title">Quality / Frame Score</div>
            <div id="qualityValue" class="quality-value">--</div>
          </div>
          <div id="rawQualityValue" class="quality-title">raw: --</div>
        </div>
        <div class="bar"><div id="qualityBar" class="bar-fill"></div></div>
        <div id="timeValue" class="quality-sub">video time: --</div>
      </section>

      <section id="organs" class="organs"></section>

      <div class="foot">
        说明：浏览器定时截取当前视频帧发给后端；如果后端还没处理完上一帧，会返回 busy，前端不会排队等待，这样展示时不会越来越卡。
      </div>
    </aside>
  </main>

  <canvas id="canvas"></canvas>

<script>
const organNames = ["eye", "nose", "cheek", "ear", "whisker"];

const video = document.getElementById("video");
const fileInput = document.getElementById("fileInput");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const playBtn = document.getElementById("playBtn");
const pauseBtn = document.getElementById("pauseBtn");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const intervalInput = document.getElementById("intervalInput");

const videoBadge = document.getElementById("videoBadge");
const statusValue = document.getElementById("statusValue");
const latencyValue = document.getElementById("latencyValue");
const skipValue = document.getElementById("skipValue");
const qualityValue = document.getElementById("qualityValue");
const rawQualityValue = document.getElementById("rawQualityValue");
const qualityBar = document.getElementById("qualityBar");
const timeValue = document.getElementById("timeValue");
const organsEl = document.getElementById("organs");

let running = false;
let inFlight = false;
let skipped = 0;
let timer = null;
let scoreMode = "class";

function createOrganRows(names) {
  organsEl.innerHTML = "";
  for (const name of names) {
    const row = document.createElement("div");
    row.className = "organ";
    row.innerHTML = `
      <div class="organ-name">${name}</div>
      <div class="bar"><div id="bar-${name}" class="bar-fill"></div></div>
      <div id="score-${name}" class="organ-value">--</div>
    `;
    organsEl.appendChild(row);
  }
}

function setStatus(text, cls) {
  statusValue.className = "mini-value " + (cls || "");
  statusValue.textContent = text;
}

function formatNum(x, digits=2) {
  if (x === undefined || x === null || Number.isNaN(Number(x))) return "--";
  return Number(x).toFixed(digits);
}

function updateScores(data) {
  if (data.busy) {
    skipped += 1;
    skipValue.textContent = String(skipped);
    setStatus("Busy", "warn");
    return;
  }

  if (data.error) {
    setStatus("Error", "bad");
    console.error(data.error);
    return;
  }

  setStatus("Live", "ok");

  const q6 = Number(data.quality_score);
  const qRaw = Number(data.quality_raw);

  qualityValue.textContent = formatNum(q6, 2);
  rawQualityValue.textContent = `raw: ${formatNum(qRaw, 3)}`;
  qualityBar.style.width = Math.max(0, Math.min(100, (q6 / 6) * 100)) + "%";

  latencyValue.textContent = `${formatNum(data.latency_ms, 0)} ms`;
  timeValue.textContent = `video time: ${formatNum(data.video_time, 2)}s`;

  const scores = data.scores || {};
  for (const [name, value] of Object.entries(scores)) {
    const scoreEl = document.getElementById(`score-${name}`);
    const barEl = document.getElementById(`bar-${name}`);
    if (!scoreEl || !barEl) continue;

    const v = Number(value);
    scoreEl.textContent = scoreMode === "class" ? String(Math.round(v)) : formatNum(v, 2);
    barEl.style.width = Math.max(0, Math.min(100, (v / 3) * 100)) + "%";
  }
}

function scheduleNext() {
  if (!running) return;
  const ms = Math.max(50, Number(intervalInput.value || 250));
  timer = setTimeout(captureAndInfer, ms);
}

async function captureAndInfer() {
  if (!running) return;

  if (video.paused || video.ended || video.readyState < 2) {
    setStatus("Waiting", "warn");
    scheduleNext();
    return;
  }

  if (inFlight) {
    skipped += 1;
    skipValue.textContent = String(skipped);
    scheduleNext();
    return;
  }

  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (!vw || !vh) {
    scheduleNext();
    return;
  }

  // 控制上传图像尺寸，减轻后端压力。显示视频仍然用原清晰度。
  const maxSide = 960;
  let cw = vw;
  let ch = vh;
  if (Math.max(vw, vh) > maxSide) {
    const scale = maxSide / Math.max(vw, vh);
    cw = Math.round(vw * scale);
    ch = Math.round(vh * scale);
  }

  canvas.width = cw;
  canvas.height = ch;
  ctx.drawImage(video, 0, 0, cw, ch);

  inFlight = true;

  canvas.toBlob(async (blob) => {
    if (!blob) {
      inFlight = false;
      scheduleNext();
      return;
    }

    const form = new FormData();
    form.append("image", blob, "frame.jpg");
    form.append("video_time", String(video.currentTime || 0));

    try {
      const resp = await fetch("/infer_frame", { method: "POST", body: form });
      const data = await resp.json();
      updateScores(data);
    } catch (err) {
      console.error(err);
      setStatus("Net Err", "bad");
    } finally {
      inFlight = false;
      scheduleNext();
    }
  }, "image/jpeg", 0.82);
}

fileInput.addEventListener("change", () => {
  const file = fileInput.files && fileInput.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  video.src = url;
  videoBadge.textContent = file.name;
});

playBtn.addEventListener("click", () => video.play());
pauseBtn.addEventListener("click", () => video.pause());

startBtn.addEventListener("click", () => {
  if (!video.src) {
    setStatus("No Video", "bad");
    return;
  }
  running = true;
  skipped = 0;
  skipValue.textContent = "0";
  setStatus("Starting", "warn");
  if (timer) clearTimeout(timer);
  captureAndInfer();
});

stopBtn.addEventListener("click", () => {
  running = false;
  if (timer) clearTimeout(timer);
  setStatus("Stopped", "warn");
});

async function init() {
  createOrganRows(organNames);

  try {
    const resp = await fetch("/config");
    const config = await resp.json();
    scoreMode = config.score_mode || "class";

    if (Array.isArray(config.organ_columns) && config.organ_columns.length > 0) {
      createOrganRows(config.organ_columns);
    }

    if (config.has_video && config.video_url) {
      video.src = config.video_url;
      videoBadge.textContent = "服务器预设视频";
    } else {
      videoBadge.textContent = "请选择本地视频文件";
    }
  } catch (err) {
    console.error(err);
    videoBadge.textContent = "无法读取后端配置";
  }
}

init();
</script>
</body>
</html>
